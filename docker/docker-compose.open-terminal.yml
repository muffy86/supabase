# OpenTerminal alongside the Supabase local stack
# Usage: docker compose -f docker/docker-compose.yml -f docker/docker-compose.open-terminal.yml up
#
# Add to .env:
#   OPEN_TERMINAL_API_KEY=$(openssl rand -hex 32)
#   OPEN_TERMINAL_PORT=8010

services:
  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: supabase-open-terminal
    restart: unless-stopped
    ports:
      - "${OPEN_TERMINAL_PORT:-8010}:8000"
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY:-changeme-set-in-env}
    volumes:
      - open_terminal_workspace:/workspace
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  open_terminal_workspace:
    name: supabase_open_terminal_workspace
